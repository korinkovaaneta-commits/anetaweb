<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast o práci | Aneta o práci</title>
  <meta name="description" content="Rozhovory i sólo epizody o práci, kariéře a životě. Poslechněte si Podcast o práci s Anetou Kořínkovou." />
  <link rel="canonical" href="https://anetakorinkova.cz/podcast.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260925-podcast-card-links" />

  <!-- Cookie consent management -->
  <script src="cookies.js"></script>
  <!-- Google Analytics 4 (respects cookie consent) -->
  <script src="analytics.js"></script>
  <style>
    .podcast-hero {
      background: var(--bg);
      padding: 1.5rem 0 2rem;
      margin-bottom: 0;
    }

    .podcast-hero__back {
      display: inline-block;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      margin-bottom: 1rem;
      transition: var(--transition);
    }

    .podcast-hero__back:hover {
      color: var(--accent);
    }

    .podcast-hero h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.25rem;
      line-height: 1.1;
    }

    .podcast-hero__desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #666666;
      max-width: 600px;
      margin-bottom: 1rem;
    }

    .podcast-hero__accent {
      width: 90px;
      height: 2px;
      background-color: var(--accent);
      margin: 0;
    }

    .podcast-hero + .section {
      padding-top: 1rem;
      padding-bottom: 0;
    }

    .podcast-container {
      padding: 0;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2.5rem;
      padding: 0;
    }

    .episode {
      display: flex;
      flex-direction: column;
    }

    .episode__image {
      width: 100%;
      aspect-ratio: 1;
      background: #F8F8F8;
      border-radius: 0;
      overflow: hidden;
      margin-bottom: 1.25rem;
      transition: all 0.2s ease;
    }

    .episode__image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .episode__meta {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .episode__title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 0.6rem;
    }

    .episode__date {
      font-size: 0.8rem;
      color: #888888;
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .episode__link {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-block;
      width: fit-content;
    }

    .episode:hover .episode__link {
      color: var(--accent);
    }

    .loading {
      text-align: center;
      padding: 3rem 0;
      color: #888888;
      font-size: 1rem;
    }

    .error {
      text-align: center;
      padding: 3rem 0;
      color: var(--accent);
      font-weight: 500;
    }

    @media (max-width: 1024px) {
      .episodes-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 2rem;
      }
    }

    @media (max-width: 768px) {
      .episodes-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .podcast-hero h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">Aneta o práci</a>
      <ul class="nav__list" id="navList">
        <li><a href="articles.html" class="nav__link">Čtení</a></li>
        <li><a href="podcast.html" class="nav__link">Podcast</a></li>
        <li><a href="index.html#omne" class="nav__link">O mně</a></li>
      </ul>
      <button class="nav__burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <!-- PODCAST HERO -->
  <section class="podcast-hero">
    <div class="container">
      <a href="index.html" class="podcast-hero__back">← Zpět na úvod</a>
      <h1>Podcast o práci</h1>
      <p class="podcast-hero__desc">Rozhovory i solo epizody o práci, kariéře a životě. Protože jedno bez druhého stejně nejde.</p>
      <div class="podcast-hero__accent"></div>
    </div>
  </section>

  <!-- EPISODES -->
  <section class="section section--light">
    <div class="container podcast-container">
      <div id="episodes-grid" class="episodes-grid">
        <div class="loading">Načítám epizody...</div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">© 2026 Aneta Kořínková. Všechna práva vyhrazena.</p>
      <nav class="footer__nav">
        <a href="privacy.html">Ochrana osobních údajů</a>
        <a href="cookies.html">Cookies</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    async function loadPodcastEpisodes() {
      const container = document.getElementById('episodes-grid');
      const rssUrl = 'https://feeds.libsyn.com/304163/podcastopraci';

      try {
        const response = await fetch(rssUrl);
        if (!response.ok) {
          throw new Error('Chyba při načítání podcastu');
        }

        const data = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data, 'text/xml');

        const parseErrors = xmlDoc.getElementsByTagName('parsererror');
        if (parseErrors.length > 0) {
          throw new Error('Chyba při parsování dat');
        }

        const items = xmlDoc.getElementsByTagName('item');
        if (items.length === 0) {
          container.innerHTML = '<div class="error">Žádné epizody nenalezeny</div>';
          return;
        }

        let episodesHtml = '';
        let episodeNumber = items.length;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          let title = item.getElementsByTagName('title')[0]?.textContent || 'Bez názvu';
          const pubDate = item.getElementsByTagName('pubDate')[0]?.textContent || '';
          const itunesImage = item.getElementsByTagNameNS('http://www.itunes.com/dtds/podcast-1.0.dtd', 'image')[0];
          const imageUrl = itunesImage?.getAttribute('href') || '';

          // Odstraň číslo epizody z názvu pokud už tam je (RSS feed jej obsahuje)
          title = title.replace(/^\d+\.\s+/, '');

          // Vytvoř slug z názvu
          const slug = title
            .toLowerCase()
            .replace(/[^a-záíéěščřžýů0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .substring(0, 50)
            .replace(/-+$/, '');

          // Formátuj datum
          const dateObj = new Date(pubDate);
          const formattedDate = dateObj.toLocaleDateString('cs-CZ', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          const episodeUrl = `episode.html?num=${episodeNumber}&slug=${slug}`;

          episodesHtml += `
            <a href="${episodeUrl}" class="episode" aria-labelledby="episode-link-${episodeNumber} episode-title-${episodeNumber}">
              ${imageUrl ? `<div class="episode__image"><img src="${imageUrl}" alt="${title}" loading="lazy" decoding="async"></div>` : ''}
              <h3 class="episode__title" id="episode-title-${episodeNumber}">${episodeNumber}. ${title}</h3>
              <div class="episode__date">${formattedDate}</div>
              <span class="episode__link" id="episode-link-${episodeNumber}">Poslechnout epizodu →</span>
            </a>
          `;

          episodeNumber--;
        }

        container.innerHTML = episodesHtml;

      } catch (error) {
        console.error('Chyba při načítání podcastů:', error);
        container.innerHTML = `<div class="error">Nepodařilo se načíst epizody. Zkuste to později.</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPodcastEpisodes);
  </script>
</body>
</html>
