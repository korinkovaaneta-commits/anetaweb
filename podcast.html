<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast o práci – Aneta Kořínková</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .podcast-header { background: #0A0A0A; color: #FFFFFF; padding: 4rem 0; margin-bottom: 3rem; }
    .podcast-header h1 { font-size: 2.5rem; line-height: 1.2; margin-bottom: 1rem; font-weight: 500; }
    .podcast-description { color: rgba(255,255,255,.7); margin-top: 1rem; }

    .episodes-list { display: flex; flex-direction: column; gap: 2rem; }

    .episode-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      align-items: start;
      padding: 2rem;
      background: #FFFFFF;
      border: 1px solid #F0F0F0;
      border-radius: 4px;
      transition: all 0.25s ease;
    }

    .episode-card:hover {
      border-color: #1C3F6E;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .episode-image {
      width: 220px;
      height: 220px;
      border-radius: 4px;
      overflow: hidden;
      background: #F8F8F8;
    }

    .episode-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .episode-content { }

    .episode-date { font-size: 13px; color: #888888; margin-bottom: 0.75rem; }
    .episode-title { font-size: 1.2rem; font-weight: 500; color: #0A0A0A; margin-bottom: 0.75rem; line-height: 1.3; }
    .episode-description { color: #555555; font-size: 14px; line-height: 1.7; margin-bottom: 1.5rem; }

    .episode-link {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #0A0A0A;
      color: #FFFFFF;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .episode-link:hover {
      background: #1C3F6E;
    }

    .episode-full-text {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #F0F0F0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .episode-full-text.show {
      max-height: 1000px;
    }

    .episode-full-text p {
      font-size: 14px;
      color: #555555;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .episode-read-more {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: transparent;
      color: #1C3F6E;
      border: 1px solid #1C3F6E;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-left: 0.5rem;
    }

    .episode-read-more:hover {
      background: #1C3F6E;
      color: #FFFFFF;
    }

    .back-link { display: inline-block; margin-bottom: 2rem; color: #FFFFFF; font-weight: 400; font-size: 14px; opacity: 0.8; text-decoration: underline; }
    .back-link:hover { opacity: 1; }

    .loading { text-align: center; padding: 3rem 0; color: #888888; }
    .error { text-align: center; padding: 3rem 0; color: #C0365A; font-weight: 500; }

    @media (max-width: 768px) {
      .episode-card {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .episode-image {
        width: 100%;
        height: auto;
      }

      .podcast-header h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">Aneta Kořínková</a>
      <ul class="nav__list" id="navList">
        <li><a href="index.html" class="nav__link">Úvod</a></li>
        <li><a href="articles.html" class="nav__link">Články</a></li>
        <li><a href="podcast.html" class="nav__link">Podcast</a></li>
        <li><a href="index.html#omne" class="nav__link">O mně</a></li>
        <li><a href="index.html#kontakt" class="nav__link nav__link--cta">Kontakt</a></li>
      </ul>
      <button class="nav__burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <!-- PODCAST HEADER -->
  <section class="podcast-header">
    <div class="container">
      <a href="index.html" class="back-link">← Zpět na úvod</a>
      <h1>Podcast o práci</h1>
      <p class="section__desc podcast-description">Rozhovory i solo epizody o práci, kariéře a životě. Protože jedno bez druhého stejně nejde.</p>
    </div>
  </section>

  <!-- EPISODES -->
  <section class="section">
    <div class="container">
      <div id="debug-info" style="display: none; background: #f5f5f5; padding: 1rem; margin-bottom: 2rem; border-radius: 4px; font-size: 12px; color: #666; font-family: monospace; white-space: pre-wrap; word-break: break-all;"></div>
      <div id="episodes-list" class="episodes-list">
        <div class="loading">Načítám epizody...</div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">© 2026 Aneta Kořínková. Všechna práva vyhrazena.</p>
      <nav class="footer__nav">
        <a href="#">Ochrana osobních údajů</a>
        <a href="#">Cookies</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Rozbalit/sbalit text epizody
    function toggleEpisodeText(elementId) {
      const element = document.getElementById(elementId);
      if (element) {
        element.classList.toggle('show');
      }
    }

    // Dynamické načítání podcast epizod z RSS feed
    async function loadPodcastEpisodes() {
      const container = document.getElementById('episodes-list');
      const debugInfo = document.getElementById('debug-info');
      const rssUrl = 'https://feeds.libsyn.com/304163/podcastopraci';
      const logs = [];

      function log(msg) {
        console.log(msg);
        logs.push(msg);
        debugInfo.textContent = logs.join('\n');
        debugInfo.style.display = 'block';
      }

      try {
        log('1. Začínam načítat RSS feed...');
        log('2. RSS URL: ' + rssUrl);

        const response = await fetch(rssUrl);
        log('3. Response status: ' + response.status);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.text();
        log('4. Data načtena, velikost: ' + data.length + ' bytes');

        if (!data || data.length < 100) {
          throw new Error('RSS feed je příliš malý nebo prázdný');
        }

        // Zkontroluj, jestli je to HTML (chyba) nebo XML
        if (data.includes('<html') || data.includes('<!DOCTYPE html')) {
          throw new Error('Proxy vrátil HTML namísto RSS (404 nebo chyba serveru)');
        }

        // Parse XML
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data, 'text/xml');
        log('5. XML parsován');

        const parseErrors = xmlDoc.getElementsByTagName('parsererror');
        if (parseErrors.length > 0) {
          log('XML Parse Error: ' + parseErrors[0].textContent);
          throw new Error('Chyba při parsování XML');
        }

        const items = xmlDoc.getElementsByTagName('item');
        log('6. Nalezeno epizod: ' + items.length);

        if (items.length === 0) {
          container.innerHTML = '<div class="error">Žádné epizody nenalezeny v RSS</div>';
          return;
        }

        let episodesHtml = '';

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          const episodeId = 'ep-podcast-' + i;

          const title = item.getElementsByTagName('title')[0]?.textContent || 'Bez názvu';
          const description = item.getElementsByTagName('description')[0]?.textContent || '';
          const pubDate = item.getElementsByTagName('pubDate')[0]?.textContent || '';
          const link = item.getElementsByTagName('link')[0]?.textContent || '#';

          // Hledej iTunes image
          const itunesImage = item.getElementsByTagNameNS('http://www.itunes.com/dtds/podcast-1.0.dtd', 'image')[0];
          const imageUrl = itunesImage?.getAttribute('href') || '';

          // Formátuj datum
          const dateObj = new Date(pubDate);
          const formattedDate = dateObj.toLocaleDateString('cs-CZ', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          // Vyčisti popis (odstraň HTML tagy)
          const cleanDescription = description
            .replace(/<[^>]*>/g, '')
            .replace(/&nbsp;/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .trim();

          const shortDescription = cleanDescription.substring(0, 250).trim();
          const hasMore = cleanDescription.length > 250;

          episodesHtml += `
            <div class="episode-card">
              ${imageUrl ? `<div class="episode-image"><img src="${imageUrl}" alt="${title}" loading="lazy"></div>` : ''}
              <div class="episode-content">
                <div class="episode-date">📅 ${formattedDate}</div>
                <h3 class="episode-title">${title}</h3>
                <p class="episode-description">${shortDescription}${hasMore ? '...' : ''}</p>
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem;">
                  <a href="${link}" target="_blank" rel="noopener noreferrer" class="episode-link">▶ Poslechnout</a>
                  ${hasMore ? `<button class="episode-read-more" onclick="toggleEpisodeText('${episodeId}')">Číst dále</button>` : ''}
                </div>
                ${hasMore ? `
                  <div id="${episodeId}" class="episode-full-text">
                    <p>${cleanDescription}</p>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        }

        log('7. HTML vygenerován, zobrazuji...');
        debugInfo.style.display = 'none';
        container.innerHTML = episodesHtml;
        log('✓ Epizody úspěšně načteny!');

      } catch (error) {
        log('❌ CHYBA: ' + error.message);
        container.innerHTML = `<div class="error"><strong>Chyba:</strong> ${error.message}</div>`;
      }
    }

    // Načti epizody když se stránka nahraje
    document.addEventListener('DOMContentLoaded', loadPodcastEpisodes);
  </script>
</body>
</html>
