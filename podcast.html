<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast o práci – Aneta Kořínková</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .podcast-header { background: #0A0A0A; color: #FFFFFF; padding: 4rem 0; margin-bottom: 3rem; }
    .podcast-header h1 { font-size: 2.5rem; line-height: 1.2; margin-bottom: 1rem; font-weight: 500; }
    .podcast-description { color: rgba(255,255,255,.7); margin-top: 1rem; }

    .episodes-list { display: flex; flex-direction: column; gap: 2rem; }

    .episode-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      align-items: start;
      padding: 2rem;
      background: #FFFFFF;
      border: 1px solid #F0F0F0;
      border-radius: 4px;
      transition: all 0.25s ease;
    }

    .episode-card:hover {
      border-color: #1C3F6E;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .episode-image {
      width: 220px;
      height: 220px;
      border-radius: 4px;
      overflow: hidden;
      background: #F8F8F8;
    }

    .episode-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .episode-content { }

    .episode-date { font-size: 13px; color: #888888; margin-bottom: 0.75rem; }
    .episode-title { font-size: 1.2rem; font-weight: 500; color: #0A0A0A; margin-bottom: 0.75rem; line-height: 1.3; }
    .episode-description { color: #555555; font-size: 14px; line-height: 1.7; margin-bottom: 1.5rem; }

    .episode-link {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #0A0A0A;
      color: #FFFFFF;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .episode-link:hover {
      background: #1C3F6E;
    }

    .back-link { display: inline-block; margin-bottom: 2rem; color: #FFFFFF; font-weight: 400; font-size: 14px; opacity: 0.8; text-decoration: underline; }
    .back-link:hover { opacity: 1; }

    .loading { text-align: center; padding: 3rem 0; color: #888888; }
    .error { text-align: center; padding: 3rem 0; color: #C0365A; font-weight: 500; }

    @media (max-width: 768px) {
      .episode-card {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .episode-image {
        width: 100%;
        height: auto;
      }

      .podcast-header h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">Aneta Kořínková</a>
      <ul class="nav__list" id="navList">
        <li><a href="index.html" class="nav__link">Úvod</a></li>
        <li><a href="articles.html" class="nav__link">Články</a></li>
        <li><a href="podcast.html" class="nav__link">Podcast</a></li>
        <li><a href="index.html#omne" class="nav__link">O mně</a></li>
        <li><a href="index.html#kontakt" class="nav__link nav__link--cta">Kontakt</a></li>
      </ul>
      <button class="nav__burger" id="navBurger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <!-- PODCAST HEADER -->
  <section class="podcast-header">
    <div class="container">
      <a href="index.html" class="back-link">← Zpět na úvod</a>
      <h1>Podcast o práci</h1>
      <p class="section__desc podcast-description">Rozhovory i solo epizody o práci, kariéře a životě. Protože jedno bez druhého stejně nejde.</p>
    </div>
  </section>

  <!-- EPISODES -->
  <section class="section">
    <div class="container">
      <div id="episodes-list" class="episodes-list">
        <div class="loading">Načítám epizody...</div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">© 2026 Aneta Kořínková. Všechna práva vyhrazena.</p>
      <nav class="footer__nav">
        <a href="#">Ochrana osobních údajů</a>
        <a href="#">Cookies</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Dynamické načítání podcast epizod z RSS feed
    async function loadPodcastEpisodes() {
      const container = document.getElementById('episodes-list');
      const rssUrl = 'http://feeds.libsyn.com/304163/podcastopraci';

      try {
        // Použij CORS proxy
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`);
        const data = await response.json();

        if (!data.contents) {
          throw new Error('Nelze načíst RSS feed');
        }

        // Parse XML
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, 'text/xml');

        if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
          throw new Error('Chyba při parsování XML');
        }

        const items = xmlDoc.getElementsByTagName('item');

        if (items.length === 0) {
          container.innerHTML = '<div class="error">Žádné epizody nenalezeny</div>';
          return;
        }

        let episodesHtml = '';

        for (let i = 0; i < items.length; i++) {
          const item = items[i];

          const title = item.getElementsByTagName('title')[0]?.textContent || 'Bez názvu';
          const description = item.getElementsByTagName('description')[0]?.textContent || '';
          const pubDate = item.getElementsByTagName('pubDate')[0]?.textContent || '';
          const link = item.getElementsByTagName('link')[0]?.textContent || '#';

          // Hledej iTunes image
          const itunesImage = item.getElementsByTagNameNS('http://www.itunes.com/dtds/podcast-1.0.dtd', 'image')[0];
          const imageUrl = itunesImage?.getAttribute('href') || '';

          // Formátuj datum
          const dateObj = new Date(pubDate);
          const formattedDate = dateObj.toLocaleDateString('cs-CZ', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          // Vyčisti popis (odstraň HTML tagy)
          const cleanDescription = description
            .replace(/<[^>]*>/g, '')
            .replace(/&nbsp;/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .substring(0, 250)
            .trim();

          episodesHtml += `
            <div class="episode-card">
              ${imageUrl ? `<div class="episode-image"><img src="${imageUrl}" alt="${title}" loading="lazy"></div>` : ''}
              <div class="episode-content">
                <div class="episode-date">📅 ${formattedDate}</div>
                <h3 class="episode-title">${title}</h3>
                <p class="episode-description">${cleanDescription}${cleanDescription.length >= 250 ? '...' : ''}</p>
                <a href="${link}" target="_blank" rel="noopener noreferrer" class="episode-link">▶ Poslechnout</a>
              </div>
            </div>
          `;
        }

        container.innerHTML = episodesHtml;

      } catch (error) {
        console.error('Chyba při načítání epizod:', error);
        container.innerHTML = `<div class="error">Nelze načíst epizody. Zkuste znovu později.</div>`;
      }
    }

    // Načti epizody když se stránka nahraje
    document.addEventListener('DOMContentLoaded', loadPodcastEpisodes);
  </script>
</body>
</html>
